# =============================================================================
# Protheus 12.1.2510 — ambiente de desenvolvimento (Coolify, Docker Compose)
# =============================================================================
# Recurso: Git Application, build pack Docker Compose, apontando para este
# repositório. As imagens são CONSTRUÍDAS a partir das oficiais da TOTVS apenas
# para instalar o dmidecode falso (ver resources/dmidecode) — o resto do
# conteúdo é o do fabricante, sem alteração.
#
# NÃO homologado para produção — ver docs do fabricante.
#
# Topologia (nomes dos serviços SÃO os hostnames internos):
#     appserver -> dbaccess-postgres:7890 -> postgres-iniciado:5432
#     appserver -> license:5555
#
# Ordem de subida, declarativa:
#     license + postgres-iniciado
#       -> fetch-artifacts   (baixa os artefatos licenciados do Drive)
#       -> initdb            (confere o banco WIN1252)
#       -> seed-config       (escreve appserver.ini, language.ini, dbaccess.ini)
#       -> dbaccess-postgres, appserver
#
# Armazenamento: os artefatos licenciados (~1,2 GB) NÃO estão no repositório —
# o GitHub recusa acima de 100 MB por arquivo e o LFS gratuito dá 1 GB. Vivem
# em /srv/protheus, no host, montados por bind absoluto, e chegam lá pelo
# serviço fetch-artifacts (ou à mão, com o mesmo script).
#
# Os scripts ficam em resources/*.sh, versionados, e NÃO inline nos `command:`.
# O Compose interpola $VAR e ${VAR} no arquivo inteiro, inclusive dentro de
# scripts; num script inline cada variável de shell precisaria de cifrão dobrado
# ($${VAR}), e uma dobra esquecida grava valor VAZIO em silêncio. Como arquivo,
# o bash é bash e nada mais.
# =============================================================================

services:

  license:
    build:
      context: .
      dockerfile: license.Dockerfile
    image: protheus-license:3.7.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 /bin/sh -c '</dev/tcp/127.0.0.1/5555'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  postgres-iniciado:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: protheus-postgres:12.1.2510_bra
    restart: unless-stopped
    volumes:
      - protheus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  fetch-artifacts:
    # One-shot. Baixa do Google Drive os artefatos licenciados que o repositório
    # não pode carregar, e grava já com os nomes que o Protheus espera.
    #
    # IDEMPOTENTE: cada arquivo é conferido por tamanho antes de baixar. O
    # download de ~1,2 GB acontece UMA vez — depois, todo boot é instantâneo.
    # A pasta é bind mount do host, então os arquivos sobrevivem a qualquer
    # recriação de container ou volume.
    #
    # FETCH_ARTIFACTS=0 desliga o download por completo (útil se o Drive ficar
    # indisponível e você já tiver os arquivos em disco).
    build:
      context: .
      dockerfile: fetcher.Dockerfile
    image: protheus-fetcher:1
    restart: "no"
    exclude_from_hc: true
    environment:
      DATA_DIR: /seed
      FETCH_ARTIFACTS: ${FETCH_ARTIFACTS:-1}
    volumes:
      - /srv/protheus:/seed

  initdb:
    # One-shot. O cluster já vem inicializado na imagem, com o banco `protheus`
    # criado em WIN1252 — então na prática este serviço CONFERE e não cria nada.
    # Ele existe para o caso de a imagem um dia não trazer o banco: aí cria, no
    # encoding certo. Idempotente por construção.
    #
    # Usa a imagem OFICIAL, e não a derivada: este serviço só roda psql, não
    # precisa do dmidecode falso. E um serviço que declara `image:` de uma tag
    # local SEM `build:` faz o Coolify rodar `docker compose pull
    # --ignore-buildable` e tentar puxar a tag de um registry que não existe.
    image: totvsengpro/postgres-dev:12.1.2510_bra
    restart: "no"
    exclude_from_hc: true
    depends_on:
      postgres-iniciado:
        condition: service_healthy
    environment:
      PGHOST: postgres-iniciado
      PGUSER: postgres
      PGPASSWORD: postgres
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        echo "==> [initdb] conferindo o banco 'protheus'"
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='protheus'" > /tmp/db.txt
        if grep -qx 1 /tmp/db.txt; then
          echo "    banco 'protheus' ja existe — conferindo o encoding"
        else
          echo "    banco 'protheus' ausente — criando em WIN1252"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE protheus ENCODING 'WIN1252' TEMPLATE template0 LC_CTYPE 'C' LC_COLLATE 'C'"
        fi
        psql -d protheus -tAc "SELECT 'banco=' || current_database() || ' encoding=' || pg_encoding_to_char(encoding) FROM pg_database WHERE datname = current_database()"

  seed-config:
    # One-shot. Gera os três arquivos de configuração que o Protheus lê do
    # disco. Roda na imagem do DbAccess porque é ela que traz o dbaccesscfg.
    #
    # O script vive em resources/seed-config.sh, versionado e legível — e por
    # isso o `specialkey` entra por variável sem nenhuma ginástica de cifrão.
    build:
      context: .
      dockerfile: dbaccess.Dockerfile
    image: protheus-dbaccess:24.1.1.0
    restart: "no"
    exclude_from_hc: true
    depends_on:
      initdb:
        condition: service_completed_successfully
      fetch-artifacts:
        condition: service_completed_successfully
    environment:
      PROTHEUS_SPECIALKEY: ${PROTHEUS_SPECIALKEY}
    volumes:
      - /srv/protheus:/seed
    entrypoint: ["/usr/local/bin/seed-config.sh"]

  dbaccess-postgres:
    # Ponte ODBC entre o AppServer e o PostgreSQL.
    # O command copia o INI gerado pelo seed-config e entrega o processo ao
    # binário do DbAccess (DBACCESS_HOME=/opt/totvs/dbaccess/multi).
    build:
      context: .
      dockerfile: dbaccess.Dockerfile
    image: protheus-dbaccess:24.1.1.0
    restart: unless-stopped
    depends_on:
      seed-config:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - /srv/protheus:/seed:ro
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        cp -f /seed/dbaccess.ini /opt/totvs/dbaccess/multi/dbaccess.ini
        cd /opt/totvs/dbaccess/multi
        exec ./dbaccess64
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 /bin/sh -c '</dev/tcp/127.0.0.1/7890'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  appserver:
    build:
      context: .
      dockerfile: appserver.Dockerfile
    image: protheus-appserver:24.3.1.1
    restart: unless-stopped
    depends_on:
      license:
        condition: service_healthy
      dbaccess-postgres:
        condition: service_healthy
      fetch-artifacts:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - /srv/protheus:/seed:ro
      # apo/ fica gravável: a compilação AdvPL escreve o RPO.
      - /srv/protheus/apo:/opt/totvs/protheus/apo
      - /srv/protheus/systemload:/opt/totvs/protheus/protheus_data/systemload:ro
      - /srv/protheus/system:/opt/totvs/protheus/protheus_data/system:ro
    ports:
      # EXCEÇÕES JUSTIFICADAS à regra de não publicar portas.
      #
      # 1234 — o TDS do VS Code e o SmartClient falam o protocolo binário do
      #        AppServer nesta porta, que não passa pelo proxy HTTP do Coolify.
      # 8080 — WebApp e 8081 — REST: acesso externo direto por porta, além do
      #        domínio. São HTTP puro, SEM TLS — ver README, "Acesso externo".
      - "1234:1234"
      - "8080:8080"
      - "8081:8081"
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        cp -f /seed/appserver.ini /opt/totvs/appserver/appserver.ini
        cp -f /seed/language.ini  /opt/totvs/appserver/language.ini
        chmod 666 /opt/totvs/appserver/language.ini
        cd /opt/totvs/appserver
        exec ./appsrvlinux
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 /bin/sh -c '</dev/tcp/127.0.0.1/1234'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  protheus_pgdata:
